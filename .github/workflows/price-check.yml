name: 월간 가격 점검

on:
  schedule:
    - cron: '17 0 1 * *' # 매월 1일 09:17 KST (정각은 실행이 몰려 피함)
  workflow_dispatch:
    inputs:
      dry_run:
        description: '이슈를 만들지 않고 본문만 출력'
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: 점검 본문 만들기
        run: node scripts/price-check.ts > "$RUNNER_TEMP/body.md" && cat "$RUNNER_TEMP/body.md"
      - name: 이슈 만들기 (같은 달 이슈가 있으면 건너뜀)
        if: github.event_name == 'schedule' || inputs.dry_run == false
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          month=$(date -u +%Y-%m)
          title="가격 점검 $month"
          gh label create price-check --color FBCA04 --description "월간 가격 점검" --force
          if gh issue list --label price-check --state all --search "$title in:title" --json number --jq 'length' | grep -qv '^0$'; then
            echo "이미 있음: $title"
          else
            gh issue create --title "$title" --label price-check --body-file "$RUNNER_TEMP/body.md"
          fi
